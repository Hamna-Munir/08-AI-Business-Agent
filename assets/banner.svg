<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F4FA"/>
    </linearGradient>
    <linearGradient id="blob" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="1040" cy="60" r="220" fill="url(#blob)"/>
  <rect x="0" y="0" width="1200" height="300" fill="none" stroke="#E3E8F0" stroke-width="2"/>

  <!-- bar-chart mark: two teal bars rising, one coral bar falling -->
  <g transform="translate(90,150)">
    <rect x="0" y="-34" width="16" height="64" rx="3" fill="#2DD4BF"/>
    <rect x="24" y="-58" width="16" height="88" rx="3" fill="#14B8A6"/>
    <rect x="48" y="-16" width="16" height="46" rx="3" fill="#F2765A"/>
  </g>

  <text x="230" y="138" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="600" fill="#101828">AI Business Agent</text>
  <text x="232" y="178" font-family="'Courier New', monospace" font-size="20" fill="#0D9488" letter-spacing="1">LEDGER</text>
  <text x="232" y="212" font-family="Arial, sans-serif" font-size="20" fill="#5B6578">Evidence-based business analysis, not a chatbot guess.</text>

  <text x="232" y="256" font-family="Arial, sans-serif" font-size="16" fill="#8A93A6">Week 8 — 90-Day AI Engineering Roadmap  ·  Hamna Munir</text>
</svg>
